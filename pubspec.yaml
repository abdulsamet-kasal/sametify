publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  audioplayers: ^6.1.0
  cached_network_image: ^3.4.1
  http: ^1.3.0
